<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Study Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1f6;--panel:#fff;--ink:#14213d;--mute:#5d6b86;--line:#d5dbe7;--acc:#0f8b8d;--accfg:#fff;--soft:#e0f1f1}
:root:not([data-theme="light"]){color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1626;--panel:#172036;--ink:#e8edf8;--mute:#93a0bd;--line:#2a3652;--acc:#3cc4c6;--accfg:#08202a;--soft:#12333a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1626;--panel:#172036;--ink:#e8edf8;--mute:#93a0bd;--line:#2a3652;--acc:#3cc4c6;--accfg:#08202a;--soft:#12333a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh;max-width:1100px;margin:0 auto}
aside{padding:24px 16px;border-right:1px solid var(--line)}
h1{font-size:1.5rem;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:.9rem;margin:0 0 20px}
.course{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:10px 12px;margin-bottom:4px;color:var(--ink);font:inherit;cursor:pointer}
.course:hover{background:var(--panel)}
.course[aria-current="true"]{background:var(--panel);border-color:var(--line);font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
button{font:inherit}
.btn{background:var(--acc);color:var(--accfg);border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{padding:24px 28px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h2{margin:0;font-size:1.8rem;font-weight:800;letter-spacing:-.02em}
.tabs{display:flex;gap:6px;margin:18px 0;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;color:var(--mute);cursor:pointer;white-space:nowrap;font-weight:600}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--acc)}
.tab small{background:var(--soft);border-radius:10px;padding:1px 7px;margin-left:4px}
.add{display:grid;grid-template-columns:2fr 2fr 1fr auto;gap:8px;margin-bottom:16px}
input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.item input[type=checkbox]{width:20px;height:20px;margin-top:3px;accent-color:var(--acc);flex:none}
.item .t{font-weight:600}
.item.done .t{text-decoration:line-through;color:var(--mute)}
.meta{color:var(--mute);font-size:.88rem;word-break:break-word}
.meta a{color:var(--acc)}
.grow{flex:1;min-width:0}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:1.2rem;line-height:1}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--mute)}
.welcome{max-width:460px;margin:60px auto;text-align:center}
.row{display:flex;gap:8px}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}main{padding:18px 14px}.add{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>My Study Hub</h1>
    <p class="sub">Every course, five places.</p>
    <div id="list"></div>
    <div class="row" style="margin-top:12px"><input id="newc" placeholder="New course name" aria-label="New course name"><button class="btn" id="addc">Add</button></div>
  </aside>
  <main id="main"></main>
</div>
<script>
var SECS=[["lectures","Lectures","Add a lecture title, slides link, or notes"],["sections","Sections","Add a section or tutorial"],["tasks","Tasks","Add an assignment or task"],["quizzes","Quizzes","Add a quiz and its date"],["project","Final project","Add a milestone or deliverable"]];
var S={courses:[],cur:null,tab:"lectures"};
try{var raw=localStorage.getItem("studyhub");if(raw){var d=JSON.parse(raw);S.courses=d.courses||[];S.cur=d.cur}}catch(e){}
function save(){try{localStorage.setItem("studyhub",JSON.stringify({courses:S.courses,cur:S.cur}))}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cur(){return S.courses.find(function(c){return c.id===S.cur})}
function pct(c){var a=0,b=0;SECS.forEach(function(s){(c.items[s[0]]||[]).forEach(function(i){a++;if(i.done)b++})});return a?Math.round(b/a*100):0}
function safeUrl(u){return /^https?:\/\//i.test(u)?u:(u?"https://"+u:"")}
function render(){
  var l=document.getElementById("list");
  l.innerHTML=S.courses.map(function(c){return '<button class="course" data-c="'+c.id+'" aria-current="'+(c.id===S.cur)+'">'+esc(c.name)+'<div class="bar"><i style="width:'+pct(c)+'%"></i></div></button>'}).join("");
  var m=document.getElementById("main"),c=cur();
  if(!c){m.innerHTML='<div class="welcome"><h2>Start with a course</h2><p class="meta">Add your first course on the left. Each one gets five sections: lectures, sections, tasks, quizzes and a final project.</p></div>';return}
  var items=c.items[S.tab]||[],sec=SECS.find(function(s){return s[0]===S.tab});
  var showDate=S.tab!=="lectures"&&S.tab!=="sections";
  m.innerHTML='<div class="head"><div><h2>'+esc(c.name)+'</h2><div class="meta">'+pct(c)+'% complete across all sections</div></div><button class="ghost" id="delc">Delete course</button></div>'
  +'<div class="tabs" role="tablist">'+SECS.map(function(s){var n=(c.items[s[0]]||[]).length;return '<button class="tab" role="tab" data-t="'+s[0]+'" aria-selected="'+(s[0]===S.tab)+'">'+s[1]+'<small>'+n+'</small></button>'}).join("")+'</div>'
  +'<div class="add"><input id="it" placeholder="Title" aria-label="Title"><input id="il" placeholder="Link (optional)" aria-label="Link"><input id="id" '+(showDate?'type="date"':'placeholder="Note"')+' aria-label="'+(showDate?'Due date':'Note')+'"><button class="btn" id="addi">Add</button></div>'
  +(items.length?items.map(function(i){return '<div class="item'+(i.done?' done':'')+'"><input type="checkbox" data-d="'+i.id+'" '+(i.done?'checked':'')+' aria-label="Mark done"><div class="grow"><div class="t">'+esc(i.title)+'</div><div class="meta">'+(i.extra?esc(i.extra)+' ':'')+(i.link?'<a href="'+esc(i.link)+'" target="_blank" rel="noopener">Open link</a>':'')+'</div></div><button class="x" data-x="'+i.id+'" aria-label="Delete item">&times;</button></div>'}).join(""):'<div class="empty">'+sec[2]+'.</div>');
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-c],[data-t],[data-x],#addc,#addi,#delc");if(!t)return;
  if(t.dataset.c){S.cur=t.dataset.c;S.tab="lectures"}
  else if(t.dataset.t){S.tab=t.dataset.t}
  else if(t.dataset.x){var c=cur();c.items[S.tab]=c.items[S.tab].filter(function(i){return i.id!==t.dataset.x})}
  else if(t.id==="addc"){addCourse()}
  else if(t.id==="addi"){addItem()}
  else if(t.id==="delc"){if(confirm("Delete this course and everything in it?")){S.courses=S.courses.filter(function(c){return c.id!==S.cur});S.cur=S.courses.length?S.courses[0].id:null}}
  save();render();
});
document.addEventListener("change",function(e){var id=e.target.dataset.d;if(!id)return;var i=cur().items[S.tab].find(function(x){return x.id===id});i.done=e.target.checked;save();render()});
document.addEventListener("keydown",function(e){if(e.key!=="Enter")return;if(e.target.id==="newc"){addCourse();save();render()}else if(e.target.id==="it"||e.target.id==="il"||e.target.id==="id"){addItem();save();render()}});
function addCourse(){var n=document.getElementById("newc").value.trim();if(!n)return;var c={id:uid(),name:n,items:{}};S.courses.push(c);S.cur=c.id;S.tab="lectures"}
function addItem(){var t=document.getElementById("it").value.trim();if(!t)return;var c=cur();var d=document.getElementById("id").value.trim();(c.items[S.tab]=c.items[S.tab]||[]).push({id:uid(),title:t,link:safeUrl(document.getElementById("il").value.trim()),extra:d,done:false})}
if(!S.cur&&S.courses.length)S.cur=S.courses[0].id;
render();
</script>
</body>
</html>
